<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Matimand Nivasi Vidyalay</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#312e81">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/byteharvester/BeedSchoolApp/main/logo.png">
  
  <link rel="stylesheet" href="styles.css">
  
  <!-- Preconnect for faster loading -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="preconnect" href="https://raw.githubusercontent.com">
  
  <meta name="version" content="2.1.0">
  <meta name="description" content="Matimand Nivasi Vidyalay - School Management System">
</head>
<body>

  <!-- ====== SPLASH SCREEN ====== -->
  <div id="splash-screen">
    <div class="splash-content">
      
      <!-- Header with Clock -->
      <div class="splash-header">
        <div id="greeting-text" class="greeting">Good Morning</div>
        <div id="clock-text" class="clock">--:--</div>
        <div id="date-text" class="date">--</div>
      </div>

      <!-- Main Card -->
      <div class="splash-card">
        <div class="logo-container">
          <img src="https://raw.githubusercontent.com/byteharvester/BeedSchoolApp/main/logo.png" alt="School Logo" class="logo-img" id="splash-logo">
          <div class="logo-glow"></div>
        </div>
        
        <h1 class="school-title">Matimand Nivasi Vidyalay</h1>
        <p class="school-subtitle">Empowering Education</p>
        
        <!-- Progress -->
        <div class="progress-wrap">
          <div class="progress-track">
            <div id="progress-fill" class="progress-fill" style="transform: scaleX(0);"></div>
          </div>
          <div class="progress-info">
            <span id="loading-message">Initializing...</span>
            <span id="loading-percent">0%</span>
          </div>
        </div>
        
        <!-- Status - This shows Google verification status -->
        <div id="loading-status" class="status-text">
          <span class="status-dot pulse"></span>
          Connecting to server...
        </div>
      </div>

      <!-- Footer -->
      <div class="splash-footer">
        <div class="footer-brand">Powered by <strong>ByteHarvester</strong></div>
        <div class="footer-version">v2.1.0</div>
        <div id="update-badge" class="update-badge hidden">
          <span class="update-icon">⟳</span> Update Available
        </div>
      </div>
    </div>
  </div>

  <!-- ====== ERROR SCREEN ====== -->
  <div id="error-screen" class="hidden">
    <div class="error-card">
      <div class="error-icon">⚠️</div>
      <h2 id="error-title">Connection Lost</h2>
      <p id="error-message">Unable to reach the server. Please check your network.</p>
      <button id="btn-retry" class="btn-retry">⟳ Retry</button>
    </div>
  </div>

  <!-- ====== APP IFRAME ====== -->
  <div id="app-container">
    <iframe 
      id="app-frame" 
      src="https://script.google.com/macros/s/AKfycbxHHbBNOiYJs5SIr-NNQCPf4m3NQrLNAUoYuultnG4LuzUC6hDoBAz6vMlC0pGAHqHP/exec" 
      allow="geolocation; microphone; camera; clipboard-read; clipboard-write; fullscreen"
      loading="eager">
    </iframe>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
