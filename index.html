<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Updating MySchool...</title>
  <meta name="theme-color" content="#312e81">
  
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #312e81, #4c1d95);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <script>
    // 1. Force unregister the old Service Worker so the app stops loading the old cached files
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // 2. Instantly redirect to the NEW React App URL
    // Note: I used the URL from your new repository based on our previous steps
    setTimeout(function() {
      window.location.replace("https://byteharvester.github.io/school-management-app/");
    }, 1500); // 1.5 second delay just so they see the "Updating" message
  </script>
</head>
<body>
  <div class="spinner"></div>
  <h2>Updating System...</h2>
  <p style="opacity: 0.8; font-size: 14px;">Moving you to the new, faster BeedSchool App.</p>
</body>
</html>
