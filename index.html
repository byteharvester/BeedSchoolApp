<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Matimand Nivasi Vidyalay</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#312e81">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/byteharvester/BeedSchoolApp/main/logo.png">
  
  <link rel="preload" href="styles.css" as="style">
  <link rel="preload" href="app.js" as="script">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="splash-screen" class="active">
    
    <div class="splash-header">
      <div id="greeting-text" class="greeting">Loading...</div>
      <div id="clock-text" class="clock">--:--</div>
      <div id="date-text" class="date">--</div>
    </div>

    <div class="glass-card float-anim">
      <div class="logo-wrapper pulse-glow">
        <img src="https://raw.githubusercontent.com/byteharvester/BeedSchoolApp/main/logo.png" alt="School Logo" width="100" height="100" decoding="async">
      </div>
      
      <h1 class="school-title">Matimand Nivasi Vidyalay</h1>
      
      <div class="progress-container">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div class="progress-stats">
          <span id="loading-message">Initializing...</span>
          <span id="loading-percent">0%</span>
        </div>
      </div>
    </div>

    <div class="splash-footer">
      <div class="branding">Powered by <strong>ByteHarvester</strong></div>
      <div class="version">v2.0.0 Enterprise</div>
    </div>
  </div>

  <div id="error-screen" class="hidden">
    <div class="glass-card text-center">
      <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
      <h2 id="error-title">Connection Lost</h2>
      <p id="error-message">Unable to reach the school server. Please check your network connection.</p>
      <button id="btn-retry" class="btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Retry Connection
      </button>
    </div>
  </div>

  <div id="app-container">
    <iframe 
      id="app-frame" 
      src="MY_GOOGLE_APPS_SCRIPT_EXEC_URL" 
      allow="geolocation; microphone; camera; clipboard-read; clipboard-write; fullscreen">
    </iframe>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
