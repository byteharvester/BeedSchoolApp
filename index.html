<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SMI - School Monitoring Interface</title>
  
  <!-- PWA Requirements -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#312e81">
  
  <!-- iOS Native App Meta Tags (Hides Safari URL Bar) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SMI">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/byteharvester/BeedSchoolApp/main/logo.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Hidden Iframe for Google Apps Script -->
  <div id="app-container">
    <iframe 
      id="app-frame" 
      src="https://script.google.com/macros/s/AKfycbxHHbBNOiYJs5SIr-NNQCPf4m3NQrLNAUoYuultnG4LuzUC6hDoBAz6vMlC0pGAHqHP/exec" 
      allow="geolocation; microphone; camera">
    </iframe>
  </div>

  <!-- Smart Splash Screen -->
  <div id="splash-screen">
    <div class="splash-content">
      <div class="splash-header">
        <div class="greeting" id="greeting-text">Good Morning</div>
        <div class="clock" id="clock-text">--:--</div>
        <div class="date" id="date-text">Loading date...</div>
      </div>

      <div class="splash-card">
        <div class="logo-wrapper">
          <img id="splash-logo" src="https://raw.githubusercontent.com/byteharvester/BeedSchoolApp/main/logo.png" alt="SMI Logo">
          <div class="logo-fallback">SMI</div>
          <div class="logo-ring"></div>
        </div>
        
        <h1 class="school-title">SMI</h1>
        <h2 class="school-subtitle">School Monitoring Interface</h2>

        <div class="progress-wrap">
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="progress-info">
            <span id="loading-message">Initializing...</span>
            <span id="loading-percent">0%</span>
          </div>
        </div>

        <div class="status-text loading" id="loading-status">
          <span class="status-dot pulse"></span>
          <span class="status-text-content">Connecting to server...</span>
        </div>
      </div>

      <div class="splash-footer">
        <div class="footer-brand">Secured by <strong>Google Workspace</strong></div>
        <div class="footer-version">v3.1.0</div>
      </div>
    </div>
  </div>

  <!-- Error Screen -->
  <div id="error-screen" class="hidden">
    <div class="error-card">
      <div class="error-icon">⚠️</div>
      <h2 id="error-title">Connection Error</h2>
      <p id="error-message">Unable to reach the server.</p>
      <button id="btn-retry" class="btn-retry">Try Again</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
