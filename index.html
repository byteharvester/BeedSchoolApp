<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Matimand Nivasi Vidyalay</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#312e81">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/byteharvester/BeedSchoolApp/main/logo.png">
  
  <!-- Preload Critical Assets -->
  <link rel="preload" href="styles.css" as="style">
  <link rel="preload" href="app.js" as="script">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Preconnect to Google Apps Script -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.google.com">
  
  <!-- Version Control - Force cache bust on new releases -->
  <meta name="version" content="2.0.0">
  
  <style>
    /* Critical CSS for First Paint */
    body { margin:0; background:#312e81; overflow:hidden; height:100dvh; }
    #splash-screen { position:fixed; inset:0; z-index:1000; background:linear-gradient(145deg,#312e81,#4c1d95); display:flex; flex-direction:column; justify-content:space-between; align-items:center; padding:calc(2rem + env(safe-area-inset-top)) 1.5rem calc(2rem + env(safe-area-inset-bottom)); color:#fff; transition:opacity .8s cubic-bezier(.4,0,.2,1),transform .8s cubic-bezier(.4,0,.2,1); will-change:opacity,transform; }
    #splash-screen.fade-out { opacity:0; transform:scale(1.05); pointer-events:none; }
    #app-container { position:fixed; inset:0; z-index:10; background:#f1f5f9; }
    iframe { width:100%; height:100%; border:none; display:block; background:#f1f5f9; }
    .hidden { display:none !important; }
  </style>
</head>
<body>

  <!-- ========== SPLASH SCREEN ========== -->
  <div id="splash-screen" class="active">
    
    <div class="splash-header">
      <div id="greeting-text" class="greeting">Loading...</div>
      <div id="clock-text" class="clock">--:--</div>
      <div id="date-text" class="date">--</div>
    </div>

    <div class="glass-card float-anim">
      <div class="logo-wrapper">
        <img src="https://raw.githubusercontent.com/byteharvester/BeedSchoolApp/main/logo.png" alt="School Logo" width="100" height="100" decoding="async" loading="lazy">
        <div class="logo-ring"></div>
      </div>
      
      <h1 class="school-title">Matimand Nivasi Vidyalay</h1>
      <p class="school-subtitle">Empowering Education</p>
      
      <div class="progress-container">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div class="progress-stats">
          <span id="loading-message">Initializing...</span>
          <span id="loading-percent">0%</span>
        </div>
      </div>
    </div>

    <div class="splash-footer">
      <div class="branding">Powered by <strong>ByteHarvester</strong></div>
      <div class="version">v2.0.0 Enterprise</div>
      <div id="update-badge" class="update-badge hidden">
        <i class="update-icon">⟳</i> Update Available
      </div>
    </div>
  </div>

  <!-- ========== ERROR SCREEN ========== -->
  <div id="error-screen" class="hidden">
    <div class="glass-card text-center">
      <div class="error-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </div>
      <h2 id="error-title">Connection Lost</h2>
      <p id="error-message">Unable to reach the school server. Please check your network.</p>
      <button id="btn-retry" class="btn-primary">
        <span>⟳</span> Retry Connection
      </button>
    </div>
  </div>

  <!-- ========== APP IFRAME ========== -->
  <div id="app-container">
    <iframe 
      id="app-frame" 
      src="https://script.google.com/macros/s/AKfycbxHHbBNOiYJs5SIr-NNQCPf4m3NQrLNAUoYuultnG4LuzUC6hDoBAz6vMlC0pGAHqHP/exec" 
      allow="geolocation; microphone; camera; clipboard-read; clipboard-write; fullscreen"
      loading="lazy">
    </iframe>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
