<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Matimand Nivasi Vidyalay</title>
  <meta name="theme-color" content="#4338ca">
  
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      height: 100vh; 
      background-color: #4338ca; /* Indigo-700 matching your app */
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      color: white; 
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    img { 
      width: 90px; 
      height: 90px; 
      border-radius: 20px; 
      margin-bottom: 25px; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.3); 
      background: white;
      padding: 4px;
    }
    .loader { 
      border: 4px solid rgba(255,255,255,0.2); 
      border-top: 4px solid white; 
      border-radius: 50%; 
      width: 35px; 
      height: 35px; 
      animation: spin 1s linear infinite; 
      margin-bottom: 20px; 
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
    p { font-size: 13px; color: #a5b4fc; margin-top: 8px; font-weight: 500; }
  </style>
</head>
<body>

  <!-- Beautiful Loading UI -->
  <img src="https://raw.githubusercontent.com/byteharvester/BeedSchoolApp/main/logo.png" alt="School Logo">
  <div class="loader"></div>
  <h2>Authenticating...</h2>
  <p>Connecting securely to Google Workspace</p>

  <script>
    // 🚀 THE MAGIC REDIRECT: Bypasses the iframe cookie block!
    // After 1 second of showing the beautiful logo, it securely launches the real app.
    
    setTimeout(() => {
      window.location.replace("https://script.google.com/macros/s/AKfycbxHHbBNOiYJs5SIr-NNQCPf4m3NQrLNAUoYuultnG4LuzUC6hDoBAz6vMlC0pGAHqHP/exec");
    }, 1200);
  </script>

</body>
</html>
